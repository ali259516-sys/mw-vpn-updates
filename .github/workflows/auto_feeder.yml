name: Auto Update Clean VPN Feed

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mw-vpn-cloud-feeds
  cancel-in-progress: true

jobs:
  build-clean-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Java Engine Available
        run: java -version && javac -version

      - name: Fetch, Filter & Real-Exit + AI-Clean Verify Nodes
        run: python3 scripts/auto_feeder.py

      - name: Publish to Isolated feeds Branch (Zero Main-Branch Noise)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s vip_clean.txt ]; then
            echo "No new vip_clean.txt generated; preserving previous feed."
            exit 0
          fi
          mkdir -p /tmp/mw_feeds_branch
          cp vip_clean.txt stats.txt /tmp/mw_feeds_branch/
          cd /tmp/mw_feeds_branch
          git init -b feeds
          git config user.name "mw-vpn-feeder"
          git config user.email "actions@users.noreply.github.com"
          git add vip_clean.txt stats.txt
          git commit -m "Auto-update v4.0 clean verified nodes ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feeds:feeds

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -fsS --max-time 15 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@feeds/vip_clean.txt" || true
          curl -fsS --max-time 15 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@feeds/stats.txt" || true
