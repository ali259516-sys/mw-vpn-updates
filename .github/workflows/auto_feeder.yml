name: Auto Update Clean VPN Feed

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mw-vpn-cloud-feeds
  cancel-in-progress: true

jobs:
  build-clean-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load Previous Verified Feed for Accumulation
        run: |
          if git fetch origin feeds --depth=1 2>/dev/null; then
            git show FETCH_HEAD:vip_clean.txt > prev_vip_clean.txt 2>/dev/null || true
          fi
          echo "Loaded previous seed lines: $(wc -l < prev_vip_clean.txt 2>/dev/null || echo 0)"

      - name: Run Cloud Accumulator v5.1 (Balanced Real Exit-IP + MENA/EU Low-Ping)
        run: python3 scripts/auto_feeder.py

      - name: Publish to Isolated feeds Branch (Single Clean Commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s vip_clean.txt ]; then
            echo "No new vip_clean.txt generated; preserving previous feed."
            exit 0
          fi
          mkdir -p /tmp/mw_feeds_branch
          cp vip_clean.txt stats.txt /tmp/mw_feeds_branch/
          cd /tmp/mw_feeds_branch
          git init -b feeds
          git config user.name "mw-vpn-feeder"
          git config user.email "actions@users.noreply.github.com"
          git add vip_clean.txt stats.txt
          git commit -m "Cloud Accumulator v5.1 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feeds:feeds

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -fsS --max-time 15 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@feeds/vip_clean.txt" || true
          curl -fsS --max-time 15 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@feeds/stats.txt" || true
