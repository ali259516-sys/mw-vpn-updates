name: Instant FCM Push Wakeup

on:
  push:
    branches: [ main ]
    paths:
      - 'update.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Send High-Priority FCM Push
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/send_fcm_push.py
