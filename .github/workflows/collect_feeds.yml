name: MW VPN Cloud Feed Collector

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mw-vpn-cloud-feeds
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect and verify MW-compatible nodes
        run: python3 scripts/collect_nodes.py

      - name: Push vip_clean.txt to isolated feeds branch
        run: |
          if [ ! -s /tmp/vip_clean.txt ]; then
            echo "No output generated, skipping push."
            exit 0
          fi
          git config user.name "MW VPN Cloud Bot"
          git config user.email "bot@mw-vpn.local"
          git checkout --orphan feeds_tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/vip_clean.txt vip_clean.txt
          git add vip_clean.txt
          COUNT=$(grep -vc '^#' vip_clean.txt || echo 0)
          git commit -m "Cloud Feed Update: ${COUNT} verified nodes"
          git push --force origin HEAD:refs/heads/feeds

      - name: Purge jsDelivr CDN cache
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@feeds/vip_clean.txt" || true
